services:
  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.10
    command: [redpanda, start, --mode, dev-container, --smp, "1", --memory, 512M, --kafka-addr, "0.0.0.0:9092", --advertise-kafka-addr, "kafka:9092"]
    volumes: [kafka-data:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -Eq 'Healthy: *true|Healthy:[[:space:]]+true'"]
      interval: 5s
      timeout: 5s
      retries: 30
  topic:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.10
    entrypoint: ["/bin/sh", "-ec"]
    command: ["for t in transactions alerts; do rpk topic describe $$t -X brokers=kafka:9092 >/dev/null 2>&1 || rpk topic create $$t -p 1 -X brokers=kafka:9092; done"]
    depends_on:
      kafka: {condition: service_healthy}
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aml
      POSTGRES_PASSWORD: synthetic-demo
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "aml"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
  migrate:
    image: postgres:16
    environment:
      PGPASSWORD: synthetic-demo
    volumes: [./sql:/migrations:ro]
    command: ["psql","-h","postgres","-U","postgres","-d","aml","-v","ON_ERROR_STOP=1","-f","/migrations/002-scoring.sql","-f","/migrations/003-kyc.sql"]
    depends_on:
      postgres: {condition: service_healthy}
  scorer:
    build: .
    volumes: [./watchlists:/app/watchlists:ro]
    environment:
      SDN_FILE: ${SDN_FILE:-watchlists/sample.xml}
    entrypoint: ["python","-u","scoring.py"]
    depends_on:
      topic: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
    restart: on-failure
  api:
    build: .
    volumes: [./watchlists:/app/watchlists:ro]
    environment:
      SDN_FILE: ${SDN_FILE:-watchlists/sample.xml}
    entrypoint: ["uvicorn","api:app","--host","0.0.0.0","--port","8000"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  ingest:
    build: .
    command: ["ingest"]
    depends_on:
      postgres: {condition: service_healthy}
      topic: {condition: service_completed_successfully}
    restart: on-failure
volumes:
  pg-data:
  redis-data:
  kafka-data:
