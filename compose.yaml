services:
  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.10
    command: [redpanda, start, --mode, dev-container, --smp, "1", --memory, 512M, --kafka-addr, "0.0.0.0:9092", --advertise-kafka-addr, "kafka:9092", --set, "redpanda.enable_metrics_reporter=false"]
    networks: [internal]
    volumes: [kafka-data:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -Eq 'Healthy: *true|Healthy:[[:space:]]+true'"]
      interval: 5s
      timeout: 5s
      retries: 30
  topic:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.10
    entrypoint: ["/bin/sh", "-ec"]
    # The kafka --set flag only bootstraps fresh clusters; this keeps telemetry off on existing volumes too.
    # transactions: account-keyed, 16 partitions (ADR-033). alerts stays 1 partition (ADR-017). Existing topics are left as they are.
    command: ["rpk topic describe transactions -X brokers=kafka:9092 >/dev/null 2>&1 || rpk topic create transactions -p 16 -X brokers=kafka:9092; rpk topic describe alerts -X brokers=kafka:9092 >/dev/null 2>&1 || rpk topic create alerts -p 1 -X brokers=kafka:9092; rpk cluster config set enable_metrics_reporter false -X admin.hosts=kafka:9644"]
    networks: [internal]
    depends_on:
      kafka: {condition: service_healthy}
  postgres:
    image: pgvector/pgvector:pg16
    # Phase 6 (NFR-009): the 128 MB default cache misses most index pages once the audit table grows.
    command: ["postgres", "-c", "shared_buffers=512MB"]
    environment:
      POSTGRES_DB: aml
      POSTGRES_PASSWORD: synthetic-demo
    networks: [internal]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./sql/001-foundations.sql:/docker-entrypoint-initdb.d/001-foundations.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "aml"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    networks: [internal]
    volumes: [redis-data:/data]
  migrate:
    image: postgres:16
    environment:
      PGPASSWORD: synthetic-demo
    networks: [internal]
    volumes: [./sql:/migrations:ro]
    secrets: [investigator_db_password]
    entrypoint: ["sh","-ec"]
    # The password is trimmed like investigator.read_secret (str.strip) and must be non-empty before psql runs.
    command: ["p=$$(sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$$//' /run/secrets/investigator_db_password); test -n \"$$p\"; printf '%s\\n' '\\i /migrations/002-scoring.sql' '\\i /migrations/003-kyc.sql' '\\i /migrations/004-investigation.sql' '\\i /migrations/005-console.sql' | psql -h postgres -U postgres -d aml -v ON_ERROR_STOP=1 -v investigator_password=\"$$p\" -f -"]
    depends_on:
      postgres: {condition: service_healthy}
  scorer:
    build: .
    networks: [internal]
    volumes: [./watchlists:/app/watchlists:ro]
    environment:
      SDN_FILE: ${SDN_FILE:-watchlists/sample.xml}
    entrypoint: ["python","-u","scoring.py"]
    deploy:
      replicas: ${SCORER_REPLICAS:-8}
    depends_on:
      topic: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
    restart: on-failure
  api:
    build: .
    networks: [internal, ingress]
    volumes: [./watchlists:/app/watchlists:ro]
    environment:
      SDN_FILE: ${SDN_FILE:-watchlists/sample.xml}
    secrets: [analysts]
    entrypoint: ["uvicorn","api:app","--host","0.0.0.0","--port","8000"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  ingest:
    build: .
    command: ["ingest"]
    networks: [internal]
    depends_on:
      postgres: {condition: service_healthy}
      topic: {condition: service_completed_successfully}
    restart: on-failure
  investigator:
    build: {context: ., target: investigator}
    entrypoint: ["python","-u","investigator.py"]
    networks: [internal]
    environment:
      LLM_MODE: ${LLM_MODE:-stub}
      DATA_CLASSIFICATION: ${DATA_CLASSIFICATION:-}
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_ATTEMPTS: ${LLM_MAX_ATTEMPTS:-3}
    secrets: [investigator_db_password]
    depends_on:
      topic: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}
    restart: on-failure
  llm:
    build: {context: ., dockerfile: llm.Dockerfile, args: {OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:3b}"}}
    profiles: ["local"]
    networks: [internal]
    restart: on-failure
  watchlist-fetch:
    build: .
    profiles: ["fetch"]
    entrypoint: ["python","-u","watchlist.py"]
    networks: [egress]
    volumes: ["./watchlists:/app/watchlists"]
    restart: "no"
networks:
  internal: {internal: true}
  ingress: {}
  egress: {}
secrets:
  analysts: {file: "${ANALYSTS_SECRET:-./secrets/demo/analysts}"}
  investigator_db_password: {file: "${INVESTIGATOR_DB_PASSWORD_SECRET:-./secrets/demo/investigator_db_password}"}
volumes:
  pg-data:
  redis-data:
  kafka-data:
