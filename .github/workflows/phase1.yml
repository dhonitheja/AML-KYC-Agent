name: AML ingestion and real-time scoring
on: [push, workflow_dispatch]
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - run: docker compose run --rm --entrypoint python ingest -m pytest -q
      - run: docker compose run --rm ingest seed
      - run: docker compose run --rm --entrypoint python ingest latency.py
      - run: curl --fail http://localhost:8000/alerts | python -c "import json,sys; assert any(a['case_id']=='AML-1042' for a in json.load(sys.stdin))"
      - run: docker compose run --rm ingest benchmark --seconds 60
      - if: failure()
        run: docker compose logs
