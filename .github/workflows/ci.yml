name: AML ingestion and real-time scoring
on:
  push:
  workflow_dispatch:
    inputs:
      load_runner:
        description: Runner label for the 1,000 tx/s load-test job (standard 4-vCPU runners are expected to fall short)
        default: ubuntu-latest
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # NFR-008 AC-2/AC-7/AC-8: topology checks before anything starts (config builds nothing)
      - run: docker compose --profile fetch --profile local config --format json | python3 tests/compose_check.py base
      - run: docker compose -f compose.yaml -f compose.anthropic.yaml --profile fetch --profile local config --format json | python3 tests/compose_check.py anthropic
      - run: docker compose up --build -d
      - name: Check investigator runtime files
        run: |
          docker compose exec -T investigator python - <<'PY'
          from pathlib import Path
          app = Path("/app")
          assert not (app / "pipeline.py").exists()
          assert {p.relative_to(app / "tests").as_posix() for p in (app / "tests").rglob("*") if p.is_file()} == {
              "egress_check.py", "eval/scenarios.json",
          }
          PY
      - run: |
          curl --retry 30 --retry-connrefused --retry-delay 2 --fail http://localhost:8000/alerts >/dev/null
          test -n "$(docker compose ps --status running -q investigator)"
      - run: docker compose run --rm --entrypoint python ingest -m pytest -v
      - run: docker compose run --rm migrate  # migrations are idempotent: a second run must succeed
      - name: migrate output never contains the investigator DB password
        run: |
          pw=$(tr -d '\r\n' < "${INVESTIGATOR_DB_PASSWORD_SECRET:-./secrets/demo/investigator_db_password}")
          test -n "$pw"
          if docker compose logs migrate | grep -qF "$pw"; then echo "password leaked in migrate output"; exit 1; fi
      # NFR-008 AC-1 (deny with a positive control) and AC-8
      - run: docker compose exec -T investigator python tests/egress_check.py --deny api.anthropic.com:443 --allow postgres:5432
      - run: docker compose exec -T scorer python tests/egress_check.py --deny api.anthropic.com:443 --allow postgres:5432
      - run: docker compose --profile fetch run --rm --no-deps --entrypoint python watchlist-fetch tests/egress_check.py --deny postgres:5432
      - run: docker compose exec -T kafka rpk cluster config get enable_metrics_reporter | grep -qx false
      - run: docker compose run --rm ingest seed
      - run: docker compose run --rm --entrypoint python ingest latency.py
      - run: curl --fail http://localhost:8000/alerts | python -c "import json,sys; assert any(a['case_id']=='AML-1042' for a in json.load(sys.stdin))"
      - name: AML-1042 drafted row (stub, customer)
        run: |
          for i in $(seq 30); do
            n=$(docker compose exec -T postgres psql -U postgres -d aml -tAc "SELECT count(*) FROM audit WHERE action='investigation.drafted.v1' AND case_id='AML-1042' AND model_version='stub-v1' AND inputs->>'data_classification'='customer'")
            [ "$n" -ge 1 ] && exit 0
            sleep 2
          done
          exit 1
      - run: docker compose run --rm ingest benchmark --seconds 60
      # NFR-009 smoke: the partitioned, batched scorer path end to end at a rate a 4-vCPU runner sustains.
      - run: docker compose run --rm ingest loadtest --rate 300 --seconds 20 --target 250
      - if: failure()
        run: docker compose logs
  load-test:
    # NFR-009 full gate: offer 1,200/s for 60 s on fresh volumes, require >= 1,000 scored/s. Manual only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.load_runner || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - run: curl --retry 30 --retry-connrefused --retry-delay 2 --fail http://localhost:8000/alerts >/dev/null
      - run: docker compose stop investigator  # measure the scoring path; the investigator is a separate async consumer
      - run: docker compose run --rm ingest loadtest --rate 1200 --seconds 60 --target 1000
      - if: failure()
        run: docker compose logs --tail 200
  local-model:
    # Opt-in only: the Ollama image with baked weights is several GB (NFR-008 AC-6, FR-010.5 AC-6, US-029).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLM_MODE: local
      LLM_MODEL: qwen2.5:3b
      OLLAMA_MODEL: qwen2.5:3b
      LOCAL_LLM_URL: http://llm:11434
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile local build llm
      - run: docker compose --profile local up --build -d
      - run: curl --retry 30 --retry-connrefused --retry-delay 2 --fail http://localhost:8000/alerts >/dev/null
      - run: docker compose exec -T investigator python tests/egress_check.py --deny api.anthropic.com:443 --allow llm:11434
      - run: >-
          docker compose exec -T investigator python -c "import llm;
          t, _ = llm.LocalLLM('http://llm:11434', 'qwen2.5:3b', 120).complete('Reply with a JSON object.', 'ok');
          assert isinstance(t, str) and t"
      - run: docker compose run --rm ingest seed
      - name: AML-1042 investigation row from the local model
        run: |
          for i in $(seq 120); do
            n=$(docker compose exec -T postgres psql -U postgres -d aml -tAc "SELECT count(*) FROM audit WHERE action LIKE 'investigation.%.v1' AND case_id='AML-1042' AND model_version='qwen2.5:3b'")
            [ "$n" -ge 1 ] && exit 0
            sleep 5
          done
          exit 1
      - name: llm logs carry no AML-1042 counterparty strings
        run: |
          names=$(docker compose exec -T postgres psql -U postgres -d aml -tAc "SELECT DISTINCT counterparty FROM transactions WHERE case_id='AML-1042'")
          docker compose logs llm > llm.log
          echo "$names" | while read -r n; do [ -z "$n" ] || ! grep -qF "$n" llm.log || exit 1; done
      - if: failure()
        run: docker compose logs
